<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WB Niche Analyzer</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 WB Niche Analyzer</h1>
            <p>Анализ ниши Wildberries: парсинг конкурентов, оценка продаж, прогноз нового товара</p>
            <nav>
                <a href="/dashboard" class="btn btn-secondary">📊 Дашборд</a>
            </nav>
        </header>

        <main>
            <section class="analyzer-card">
                <h2>Новый анализ</h2>
                <form id="analyzeForm">
                    <div class="form-group">
                        <label for="query">Поисковый запрос WB</label>
                        <input type="text" id="query" name="query" placeholder="автомобильные ароматизаторы" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="top_n">Карточек для анализа</label>
                            <input type="number" id="top_n" name="top_n" value="10" min="1" max="30">
                        </div>
                        <div class="form-group">
                            <label for="max_feedbacks">Макс. отзывов</label>
                            <input type="number" id="max_feedbacks" name="max_feedbacks" value="80" min="20" max="200">
                        </div>
                        <div class="form-group">
                            <label for="search_pages">Страниц поиска</label>
                            <input type="number" id="search_pages" name="search_pages" value="2" min="1" max="5">
                        </div>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="save" name="save" checked>
                        <label for="save">Сохранить результат в базу данных</label>
                    </div>
                    <button type="submit" class="btn btn-primary">🔍 Запустить анализ</button>
                </form>

                <div id="loader" class="loader hidden">
                    <div class="spinner"></div>
                    <p>Собираем данные с WB... Это может занять 20–40 секунд</p>
                </div>

                <div id="results" class="results hidden">
                    <h3>📋 Результат анализа</h3>
                    <div id="summary"></div>
                    <div id="forecast"></div>
                    <div id="competitors"></div>
                </div>

                <div id="error" class="error hidden"></div>
            </section>
        </main>

        <footer>
            <p>WB Niche Analyzer v2.0 | PostgreSQL + FastAPI + Railway</p>
        </footer>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
